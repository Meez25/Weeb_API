services:
  - type: web
    name: weeb-api
    runtime: python
    buildCommand: "pip install -r requirements.txt && cd weebapi && python manage.py migrate"
    startCommand: "cd weebapi && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
